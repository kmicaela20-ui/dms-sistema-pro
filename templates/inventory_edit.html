{% extends "base.html" %}{% block content %}<h1>Editar artículo {{item.sku}}</h1><form method="post"><section class="panel formgrid"><label>Categoría<input name="category" value="{{item.category}}"></label><label>Artículo<input name="item" value="{{item.item}}"></label><label>Observaciones<input name="detail" value="{{item.detail}}"></label><label>Precio mayor<input name="wholesale_price" type="number" step="0.01" value="{{item.wholesale_price}}"></label><label>Precio menor<input name="retail_price" type="number" step="0.01" value="{{item.retail_price}}"></label><label>Stock<input name="stock_qty" type="number" step="0.01" value="{{item.stock_qty}}"></label><label>Stock mínimo<input name="min_stock" type="number" step="0.01" value="{{item.min_stock}}"></label></section><button class="savebtn">Guardar cambios</button></form>{% endblock %}
