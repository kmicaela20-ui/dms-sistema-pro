{% macro common_fields(today) -%}
<div class="ordergrid"><section class="panel"><h2>Datos del pedido</h2><label>Tipo<select name="document_type" id="document_type" onchange="calc()"><option>Pedido/Factura</option><option>Presupuesto</option></select></label><label>Fecha toma<input type="date" name="date_taken" value="{{today}}"></label><label>Fecha entrega<input type="date" name="date_delivery"></label><label>Estado<select name="status"><option>Ingreso</option><option>En diseño</option><option>En producción</option><option>Terminado</option><option>Entregado</option></select></label><label>Quién recepciona<input name="receptionist"></label><label>Origen<select name="reception_channel"><option>WhatsApp</option><option>Local</option><option>Otro</option></select></label></section><section class="panel"><h2>Datos del cliente</h2><label>Nombre<input name="client_name" required></label><label>Teléfono<input name="client_phone"></label><label>Dirección<input name="client_address"></label><label>Observaciones del pedido<textarea name="client_notes"></textarea></label></section><section class="panel summary"><h2>Resumen</h2><div>Subtotal <b id="subtotalBox">$0</b></div><div>Descuento <input id="discount" name="discount" type="number" value="0" oninput="calc()"></div><div class="bigblue">Total <b id="totalBox">$0</b></div><div>Seña <input id="deposit" name="deposit" type="number" value="0" oninput="calc()"></div><div class="bigred">Saldo <b id="balanceBox">$0</b></div><label>Método pago<select name="payment_method"><option>Efectivo</option><option>Transferencia</option><option>Mixto</option></select></label><label>Nota pago<input name="payment_note"></label></section></div>
{%- endmacro %}
