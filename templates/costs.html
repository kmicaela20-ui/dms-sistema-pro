{% extends "base.html" %}{% block content %}
<h1>💰 Calculadora de costos automáticos</h1>
<section class="panel">
<form method="post" class="formgrid">
<input name="tela" type="number" step="0.01" placeholder="Tela">
<input name="costura" type="number" step="0.01" placeholder="Costura / mano de obra">
<input name="electricidad" type="number" step="0.01" placeholder="Electricidad / desgaste">
<input name="impresion" type="number" step="0.01" placeholder="Impresión">
<input name="insumos" type="number" step="0.01" placeholder="Otros insumos">
<input name="margen" type="number" step="0.01" placeholder="Margen deseado %">
<input name="precio_venta" type="number" step="0.01" placeholder="Precio de venta actual (opcional)">
<button>Calcular</button>
</form>
</section>
{% if result %}
<section class="panel">
<h2>Resultado</h2>
<div class="kpis">
<div class="kpi">🧾<small>Costo real</small><b>${{"%.2f"|format(result.costo)}}</b></div>
<div class="kpi">📈<small>Precio sugerido</small><b>${{"%.2f"|format(result.sugerido)}}</b></div>
<div class="kpi">💵<small>Ganancia estimada</small><b>${{"%.2f"|format(result.ganancia)}}</b></div>
</div>
</section>
{% endif %}
{% endblock %}
