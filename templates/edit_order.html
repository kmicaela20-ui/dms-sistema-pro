{% extends "base.html" %}{% block content %}
<h1>Editar pedido {{order.code}}</h1><form method="post"><section class="panel formgrid"><label>Cliente<input name="client_name" value="{{order.client_name}}"></label><label>Teléfono<input name="client_phone" value="{{order.client_phone}}"></label><label>Dirección<input name="client_address" value="{{order.client_address}}"></label><label>Fecha entrega<input type="date" name="date_delivery" value="{{order.date_delivery}}"></label><label>Estado<select name="status"><option {% if order.status=='Ingreso' %}selected{% endif %}>Ingreso</option><option {% if order.status=='En diseño' %}selected{% endif %}>En diseño</option><option {% if order.status=='En producción' %}selected{% endif %}>En producción</option><option {% if order.status=='Terminado' %}selected{% endif %}>Terminado</option><option {% if order.status=='Entregado' %}selected{% endif %}>Entregado</option></select></label><label>Recepciona<input name="receptionist" value="{{order.receptionist}}"></label><label>Escuela<input name="school_name" value="{{order.school_name}}"></label><label>Grado/Año<input name="school_grade" value="{{order.school_grade}}"></label><label>Tipo de tela<input name="fabric_type" value="{{order.fabric_type}}"></label><label>Subtotal<input name="subtotal" type="number" step="0.01" value="{{order.subtotal}}"></label><label>Descuento<input name="discount" type="number" step="0.01" value="{{order.discount}}"></label><label>Seña/abonado<input name="deposit" type="number" step="0.01" value="{{order.deposit}}"></label><label>Método pago<select name="payment_method"><option {% if order.payment_method=='Efectivo' %}selected{% endif %}>Efectivo</option><option {% if order.payment_method=='Transferencia' %}selected{% endif %}>Transferencia</option><option {% if order.payment_method=='Mixto' %}selected{% endif %}>Mixto</option></select></label></section><section class="panel"><label>Observaciones<textarea name="client_notes">{{order.client_notes}}</textarea></label><label>Diseño general / taller<textarea name="team_design_notes">{{order.team_design_notes}}</textarea></label><label>Nota pago<input name="payment_note" value="{{order.payment_note}}"></label></section><button class="savebtn">Guardar cambios</button></form>{% endblock %}
