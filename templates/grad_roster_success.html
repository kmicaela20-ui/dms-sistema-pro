
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista enviada | DMS Sublimaciones</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 14px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }
        .card {
            max-width: 520px;
            margin: 35px auto;
            padding: 30px 22px;
            background: #fff;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 3px 15px #00000012;
        }
        .check {
            margin: 0 auto 18px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #dcfce7;
            color: #166534;
            font-size: 38px;
            line-height: 64px;
        }
        h1 { font-size: 25px; }
        p { line-height: 1.6; color: #555; }
        .code {
            display: inline-block;
            margin: 8px 0;
            padding: 10px 16px;
            background: #f3f4f6;
            border-radius: 8px;
            font-weight: bold;
        }
        .brand {
            margin-top: 24px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="check">✓</div>
        <h1>¡Lista enviada correctamente!</h1>
        <p>
            Recibimos los datos de los alumnos.
            El equipo de DMS Sublimaciones podrá revisar la información
            para continuar con el pedido.
        </p>
        <p>Referencia del pedido:</p>
        <div class="code">{{ code }}</div>
        <p>Gracias por confiar en DMS Sublimaciones.</p>
        <div class="brand">Perico y El Carmen · Jujuy</div>
    </main>
</body>
</html>
